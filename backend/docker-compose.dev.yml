version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: new-it-backend-dev
    working_dir: /app
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8001 --no-server-header
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - .:/app
      # 将宿主机 frontend 目录挂载到容器 /frontend，便于服务把 JSON 写到 /frontend/public 并在宿主机可见
      - ../frontend:/frontend
      # 日志持久化：挂载到宿主机，容器重启/删除后日志仍保留
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      # 示例：在 .env 中配置真实值
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=new-it-redis
      - REDIS_PORT=6379
      # Interactive API docs (Swagger/ReDoc/openapi.json). Code default is OFF
      # (fail-safe); dev opts in here rather than in backend/.env, which is
      # shared with prod and would leak. Prod compose sets this to false.
      - API_DOCS_ENABLED=true
      - SCHEDULER_ENABLED=false
      # Container system time = HKT so log timestamps and date folders match ops
      - TZ=Asia/Hong_Kong
      # Extra switch specifically for the login_ip scheduler so dev can disable
      # it without affecting the main IB-financial scheduler above.
      - LOGIN_IP_SCHEDULER_ENABLED=false
      # Risk-monitor schedulers stay off in dev because dev shares the SQLite
      # alert_events table with prod. Two concurrent schedulers would double-
      # write alerts and break Quick Profit cross-scan dedup (each process has
      # its own in-memory _latest_result). Rule edits / manual /scan-now still
      # work; only the periodic background tick is suppressed here.
      - BURST_SCAN_ENABLED=false
      - GAP_TRADE_SCAN_ENABLED=false
      # OPT-0062 — same reason: the intraday-return job writes/UPSERTs the
      # shared alert_events + detail table; only prod may run it.
      - INTRADAY_RETURN_SCAN_ENABLED=false
      # OPT-0040 — same reason: dev shares backend/data/risk_monitor.db with
      # prod, so the 1-min XAUUSD snapshot scheduler must be off in dev or it
      # double-writes xauusd_position_snapshots (+doubles the MySQL load).
      - XAUUSD_SNAPSHOT_SCHEDULER_ENABLED=false
      # OPT-0032 — dev must NEVER fire the intraday tier or live CRM tag
      # writes (shared .env carries prod-true values; compose environment
      # entries override env_file).
      - GAP_TRADE_INTRADAY_ENABLED=false
      - GAP_TRADE_CRM_WRITE_ENABLED=false
      # Same reason — dev and prod share backend/.env, so once prod flips the
      # last-close-IP gate to true this override is the only thing stopping dev
      # from pushing the same clients a second time.
      - LAST_CLOSE_IP_CRM_WRITE_ENABLED=false
      # OPT-0011/0013 — dev preview of cursor scan + SSE push.
      # Cursor mode is no-op when BURST_SCAN_ENABLED=false (no scheduler reads cursors),
      # but harmless to enable. SSE endpoint becomes reachable so the
      # RealtimeIndicator on /risk-monitor can show a real connection.
      # Do NOT enable BURST_FAST_TIER_ENABLED here — dev shares SQLite with prod.
      - CURSOR_SCAN_ENABLED=true
      - SSE_ENABLED=true
      # Force-include allowlist (mirror prod so dev /scan-now also detects it).
      # `{sid}-{login}` — accounts here bypass the demo/test filter in all
      # non-Gap-Trade rules. 5-60000017 = risk team validation account.
      - RISK_MONITOR_FORCE_INCLUDE_LOGINSIDS=5-60000017
      # Auth P3 — dev runs the REAL Microsoft sign-in, so the prod deploy is not
      # the first time anyone exercises it. Same reason as every override above:
      # dev and prod share backend/.env, and compose `environment:` wins.
      #
      # Reach dev at http://localhost:5173 via
      #   ssh -L 5173:127.0.0.1:5173 -L 8001:127.0.0.1:8001 kcm-trade@10.6.20.138
      # (P2 bound both ports to loopback). That URL is already registered on the
      # app registration, and Entra exempts localhost from its https-only rule.
      - AUTH_ENABLED=true
      - AUTH_COOKIE_ENABLED=true
      # http on localhost: a Secure cookie would simply not be stored.
      - AUTH_COOKIE_SECURE=false
      - ENTRA_REDIRECT_URI=http://localhost:5173/api/v1/auth/callback
      # Password-free way back in if Entra is unreachable or the app
      # registration is mid-change. Must never appear in prod's .env — main.py
      # logs a warning about it, but that is a notice, not a guard.
      - AUTH_DEV_LOGIN_EMAIL=kieran.xiang@kohleservices.com
      # OPT-0064 AI analyst agent: where the relay finds the agent container and
      # the shared secret both sides present on that hop. The token is read
      # from backend/.env (this compose file's project dir) — same value must
      # be in the root .env for prod. It is NOT in backend/.env.ai-agent, which
      # holds only the Azure credentials and is mounted into the agent alone.
      - AI_AGENT_URL=http://ai-agent:8010
      - AI_AGENT_INTERNAL_TOKEN=${AI_AGENT_INTERNAL_TOKEN:?AI_AGENT_INTERNAL_TOKEN must be set in backend/.env (dev) / .env (prod)}
    restart: unless-stopped
    depends_on:
      - redis
    # Docker 日志配置 (双保险：除了文件日志，Docker 也保留一份)
    logging:
      driver: "json-file"
      options:
        max-size: "50m"      # 单个日志文件最大 50MB
        max-file: "10"       # 保留 10 个文件 (约 500MB)
        compress: "true"     # 压缩旧日志节省空间


  # OPT-0064: the AI analyst agent (Microsoft Agent Framework + Azure OpenAI).
  # Reachable ONLY as http://ai-agent:8010 inside this compose network — no
  # `ports:` on purpose, and it refuses any request without the shared token.
  #
  # What it deliberately does NOT get:
  #   * backend/.env — the shared dev+prod file carries SMTP, CRM, FTP and
  #     MaxMind credentials the agent has no use for. Only the DB variables it
  #     needs are passed, individually, via ${...} substitution from that same
  #     file (compose reads the project dir's .env for substitution).
  #   * a writable data dir — backend/data is mounted read-only; the agent
  #     reads risk_monitor.db (alerts) and login_ip_orders.db (shared IPs)
  #     and can write nothing. WAL databases stay readable because their
  #     -wal/-shm siblings already exist in the directory.
  #   * a host port, a write-capable DB account, any file/shell tool.
  # What it does get: the Azure OpenAI credentials via env_file
  # (backend/.env.ai-agent, 0600, gitignored) and the shared token.
  #
  # TODO(ai_agent_ro): the container should log in with the dedicated read-only
  # accounts (MySQL `ai_agent_ro`, PG `pg_read_all_data` role). Until
  # AI_AGENT_DB_USER/PASSWORD and AI_AGENT_PG_USER/PASSWORD are set in
  # backend/.env the `:-` fallbacks below reuse the api's shared account.
  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile.ai-agent
    container_name: new-it-ai-agent-dev
    working_dir: /app
    command: uvicorn app.ai_agent.server:app --host 0.0.0.0 --port 8010 --no-server-header
    volumes:
      # Only the agent package is mounted for hot iteration, NOT the whole
      # backend tree: 02-contracts.md §7 requires every directory mounted into
      # this container to be free of the honeypot decoys (routes/honeypot.py
      # and the honeypot design doc would otherwise ride along). The image
      # itself still carries the full backend (services are imported), but
      # the model has no file tool, so what is on a MOUNT is the audited set.
      - ./app/ai_agent:/app/app/ai_agent:ro
      # SQLite risk_monitor.db + login_ip_orders.db, read-only. WAL databases
      # stay readable through a :ro mount because their -wal/-shm siblings
      # already exist on the host (the writer is the api container).
      - ./data:/app/data:ro
    env_file:
      - .env.ai-agent
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Hong_Kong
      - REDIS_HOST=new-it-redis
      - REDIS_PORT=6379
      - AI_AGENT_INTERNAL_TOKEN=${AI_AGENT_INTERNAL_TOKEN:?AI_AGENT_INTERNAL_TOKEN must be set in backend/.env (dev) / .env (prod)}
      # fxbackoffice replica (MySQL)
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_CHARSET=${DB_CHARSET:-utf8mb4}
      - DB_USER=${AI_AGENT_DB_USER:-${DB_USER}}
      - DB_PASSWORD=${AI_AGENT_DB_PASSWORD:-${DB_PASSWORD}}
      - FXBACK_DB_NAME=${FXBACK_DB_NAME}
      - MYSQL_DATABASE_FXBACKOFFICE=${MYSQL_DATABASE_FXBACKOFFICE:-fxbackoffice}
      # ETL source (MySQL)
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${AI_AGENT_DB_USER:-${MYSQL_USER}}
      - MYSQL_PASSWORD=${AI_AGENT_DB_PASSWORD:-${MYSQL_PASSWORD}}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      # Reporting PG (client_pnl ETL tables) + risk-V2 case layer PG
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DBNAME=${POSTGRES_DBNAME}
      - POSTGRES_DBNAME_MT5=${POSTGRES_DBNAME_MT5:-MT5_ETL}
      - POSTGRES_USER=${AI_AGENT_PG_USER:-${POSTGRES_USER}}
      - POSTGRES_PASSWORD=${AI_AGENT_PG_PASSWORD:-${POSTGRES_PASSWORD}}
      - RISK_CASES_PG_DBNAME=${RISK_CASES_PG_DBNAME}
      - RISK_CASES_PG_USER=${AI_AGENT_PG_USER:-${RISK_CASES_PG_USER}}
      - RISK_CASES_PG_PASSWORD=${AI_AGENT_PG_PASSWORD:-${RISK_CASES_PG_PASSWORD}}
    restart: unless-stopped
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  redis:
    image: redis:7-alpine
    container_name: new-it-redis
    restart: unless-stopped
    # Match prod (OPT-0019): 256MB cap + LRU eviction, prevents
    # silent OOM failure mode when cache fills up.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    # 内部通讯无需暴露端口到宿主机，更安全
